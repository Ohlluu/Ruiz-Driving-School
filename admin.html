<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Code Activity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --yellow: #FFD700; --red: #E31C25;
            --dark: #111111; --card: #1c1c1c; --white: #ffffff;
            --line: rgba(255,255,255,0.09);
            --dim: rgba(255,255,255,0.5);
            --dimmer: rgba(255,255,255,0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: var(--dark); color: var(--white);
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            padding: env(safe-area-inset-top) 1rem calc(2rem + env(safe-area-inset-bottom));
            padding-top: 1.5rem;
            min-height: 100vh;
        }
        .wrap { max-width: 620px; margin: 0 auto; }

        .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.15rem; }
        .brand span { color: var(--yellow); }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-top: 0.35rem; }
        .sub { color: var(--dim); font-size: 0.85rem; margin-top: 0.2rem; }

        /* ---- sign in ---- */
        #screen-login { margin-top: 2.5rem; }
        input {
            width: 100%; padding: 1rem; margin-top: 1.5rem;
            font-family: inherit; font-size: 1.05rem;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05); color: var(--white);
        }
        button {
            font-family: inherit; font-size: 1rem; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer;
            background: var(--yellow); color: var(--dark);
            padding: 1rem 1.25rem; width: 100%; margin-top: 0.85rem;
        }
        button:disabled { opacity: 0.5; }
        .err { color: #ff8b8b; font-size: 0.88rem; margin-top: 0.8rem; }

        /* ---- period switch ---- */
        .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; }
        .period { display: flex; gap: 0.3rem; margin: 1.25rem 0 0.35rem; }
        .period button {
            width: auto; flex: 1; margin: 0; padding: 0.7rem 0.4rem;
            font-size: 0.82rem; font-weight: 600;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
            border: 1px solid var(--line);
        }
        .period button.on { background: var(--yellow); color: var(--dark); border-color: var(--yellow); }

        /* ---- person cards ---- */
        .card {
            background: var(--card); border: 1px solid var(--line);
            border-left: 3px solid transparent;
            border-radius: 14px; padding: 1rem 1.1rem; margin-top: 0.7rem;
        }
        .card.flag { border-left-color: var(--red); background: #231a1b; }
        .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
        .who { font-size: 1.15rem; font-weight: 700; }
        .when { font-size: 1.15rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .row2 { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; margin-top: 0.15rem; }
        .count { color: var(--dim); font-size: 0.85rem; }
        .lbl { color: var(--dimmer); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.8px; }
        .places { color: var(--dim); font-size: 0.85rem; margin-top: 0.7rem; line-height: 1.45; }
        .badge {
            background: rgba(227,28,37,0.22); color: #ff9b9b;
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.8px; padding: 0.2rem 0.45rem; border-radius: 999px;
            margin-left: 0.45rem; vertical-align: middle; white-space: nowrap;
        }
        .times { color: var(--dimmer); font-size: 0.8rem; margin-top: 0.35rem; }

        .empty { color: var(--dim); font-size: 0.92rem; padding: 2rem 0; text-align: center; }
        .foot { color: var(--dimmer); font-size: 0.72rem; margin-top: 1.5rem; line-height: 1.5; }
        .note {
            background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.25);
            border-radius: 12px; padding: 0.85rem 1rem; font-size: 0.85rem;
            color: rgba(255,255,255,0.75); margin-top: 1rem;
        }
        [hidden] { display: none !important; }

        @media (min-width: 560px) {
            body { padding-top: 3rem; }
            h1 { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <div id="screen-login" hidden>
        <div class="brand">Ruiz <span>Driving School</span></div>
        <h1>Code Activity</h1>
        <p class="sub">Owner access only.</p>
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password"
               inputmode="text" autocapitalize="none" spellcheck="false" />
        <p id="login-err" class="err" hidden></p>
        <button id="signin">Sign in</button>
    </div>

    <div id="screen-data" hidden>
        <div class="head">
            <div>
                <div class="brand">Ruiz <span>Driving School</span></div>
                <h1>Code Activity</h1>
            </div>
        </div>

        <div class="period">
            <button data-days="7">7 days</button>
            <button data-days="30" class="on">30 days</button>
            <button data-days="90">90 days</button>
        </div>

        <div id="note" class="note" hidden></div>
        <div id="list"></div>
        <p class="foot" id="foot"></p>
    </div>

</div>

<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };
    var CT = 'America/Chicago';
    var days = 30;

    // Chicago time everywhere, so it always matches the clock at the school.
    function ctTime(ts) {
        return new Intl.DateTimeFormat('en-US', {
            timeZone: CT, hour: 'numeric', minute: '2-digit', hour12: true
        }).format(new Date(ts)).replace(/\s?([AP])M/, function (_, p) { return p.toLowerCase() + 'm'; });
    }
    function ctDay(ts) {
        return new Intl.DateTimeFormat('en-US', { timeZone: CT, month: 'short', day: 'numeric' })
            .format(new Date(ts));
    }
    function stamp(ts) {
        if (!ts) return '—';
        var f = new Intl.DateTimeFormat('en-CA', { timeZone: CT, year: 'numeric', month: '2-digit', day: '2-digit' });
        return f.format(new Date(ts)) === f.format(new Date()) ? ctTime(ts) : ctDay(ts) + ' ' + ctTime(ts);
    }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function render(people) {
        if (!people.length) {
            $('list').innerHTML = '<p class="empty">No logins in this period.</p>';
            return;
        }
        $('list').innerHTML = people.map(function (p) {
            var times = p.times || [];
            var earlier = times.slice(1, 4).map(stamp).join('  ·  ');
            var places = (p.locations || []).join('  ·  ') || '—';
            return '<div class="card' + (p.flagged ? ' flag' : '') + '">' +
                '<div class="row1">' +
                    '<div class="who">' + esc(p.who) +
                        (p.flagged ? '<span class="badge">check</span>' : '') + '</div>' +
                    '<div class="when">' + (times.length ? stamp(times[0]) : '—') + '</div>' +
                '</div>' +
                '<div class="row2">' +
                    '<div class="count">' + p.logins + (p.logins === 1 ? ' login' : ' logins') + '</div>' +
                    '<div class="lbl">last used</div>' +
                '</div>' +
                (earlier ? '<div class="times">also ' + earlier + '</div>' : '') +
                '<div class="places">' + esc(places) + '</div>' +
            '</div>';
        }).join('');
    }

    function show(which) {
        $('screen-login').hidden = which !== 'login';
        $('screen-data').hidden = which !== 'data';
    }

    async function load() {
        try {
            var res = await fetch('/api/admin-logs?days=' + days, { credentials: 'same-origin' });
            if (res.status === 401) {
                show('login');
                $('login-err').textContent = 'Please sign in again.';
                $('login-err').hidden = false;
                return;
            }
            if (!res.ok) throw new Error('load failed');
            var d = await res.json();

            if (d.configured === false) {
                $('note').textContent = d.note || 'Nothing is being recorded yet.';
                $('note').hidden = false;
            } else {
                $('note').hidden = true;
            }
            render(d.people || []);
            $('foot').textContent = 'A red mark means one code was used in three or more different ' +
                'towns, which can mean it has been shared. Times are Chicago time. ' +
                'Records are kept for ' + (d.retentionDays || 90) + ' days.';
        } catch (e) {
            $('list').innerHTML = '<p class="empty">Could not load. Pull down to refresh.</p>';
        }
    }

    async function signin() {
        var btn = $('signin');
        btn.disabled = true;
        $('login-err').hidden = true;
        try {
            var res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ password: $('pw').value })
            });
            if (res.status === 429) throw new Error('Too many tries. Wait a few minutes.');
            if (res.status === 500) throw new Error('Not set up yet.');
            if (!res.ok) throw new Error('Wrong password.');
            $('pw').value = '';
            show('data');
            await load();
        } catch (e) {
            $('login-err').textContent = e.message || 'Sign in failed.';
            $('login-err').hidden = false;
        } finally {
            btn.disabled = false;
        }
    }

    $('signin').addEventListener('click', signin);
    $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') signin(); });

    document.querySelectorAll('.period button').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('.period button').forEach(function (x) { x.classList.remove('on'); });
            b.classList.add('on');
            days = +b.dataset.days;
            load();
        });
    });

    // Still signed in from earlier? Go straight to the data.
    fetch('/api/admin-logs?days=30', { credentials: 'same-origin' })
        .then(function (r) {
            if (r.ok) { show('data'); load(); } else { show('login'); }
        })
        .catch(function () { show('login'); });
})();
</script>
</body>
</html>
